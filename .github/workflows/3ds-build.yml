name: Build 3DS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3ds-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Pull Polyphase base image
        run: |
          set -eux
          docker pull polyphaselabs/polyphase-engine:latest
          docker tag polyphaselabs/polyphase-engine:latest polyphase-engine:latest

      - name: Build 3DSX and CIA
        run: make cia

      - name: Verify artifacts
        run: |
          set -eux
          test -s dist/3DS/WSFgamejam2026uroboros.3dsx
          test -s dist/3DS/WSFgamejam2026uroboros.cxi
          test -s dist/3DS/WSFgamejam2026uroboros.cia
          ls -lh dist/3DS

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: WSFgamejam2026uroboros-3dsx
          path: dist/3DS/WSFgamejam2026uroboros.3dsx
          if-no-files-found: error
          retention-days: 14

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: WSFgamejam2026uroboros-cia
          path: |
            dist/3DS/WSFgamejam2026uroboros.cia
            dist/3DS/WSFgamejam2026uroboros.cxi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: 3ds-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WSFgamejam2026uroboros-*
          path: release-assets
          merge-multiple: true

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName --jq '.[].tagName' \
            | sed -nE 's/^v0\.([0-9]+)$/\1/p' | sort -n | tail -n1)"
          next=1
          if [ -n "$latest" ]; then
            next=$((latest + 1))
          fi
          echo "tag=v0.$next" >> "$GITHUB_OUTPUT"
          echo "Next release: v0.$next"

      - name: Create release
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            release-assets/WSFgamejam2026uroboros.3dsx \
            release-assets/WSFgamejam2026uroboros.cia \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Prune old releases
        run: |
          set -euo pipefail
          mapfile -t versions < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName --jq '.[].tagName' \
            | sed -nE 's/^v0\.([0-9]+)$/\1/p' | sort -rn)
          for version in "${versions[@]:5}"; do
            echo "Deleting release v0.$version"
            gh release delete "v0.$version" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
